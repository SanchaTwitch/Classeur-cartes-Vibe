        .search-box button { background-color: #e74c3c; color: white; padding: 10px 20px; border-radius: 5px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; height: 43px; }

        .autocomplete-item:hover { background-color: #9146FF; padding-left: 20px; }
        .autocomplete-item strong { color: #ffd700; }

        /* --- STYLES DES MINI-CARTES --- */
        .mini-card { width: 100px; height: 140px; background: #222; border-radius: 8px; border: 2px solid; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.6); transition: transform 0.2s; }
        .mini-card:hover { transform: scale(1.05); cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.8); z-index: 20; }

        .mini-card.commune { border-color: #555; } .mini-card.peu-commun { border-color: #2ecc71; } .mini-card.rare { border-color: #00d2ff; } .mini-card.tres-rare { border-color: #9b59b6; } .mini-card.legendaire { border-color: #ffd700; } .mini-card.mythique { border-color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.5); }

        .mini-name { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-family: 'Bebas Neue', sans-serif; font-size: 14px; text-align: center; padding: 4px 0; letter-spacing: 1px; }
        .mini-card.locked .mini-name { display: none; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { text-align: center; position: relative; animation: zoomIn 0.3s ease; display: flex; flex-direction: column; align-items: center; }

    // ==========================================
    // 🔐 SYSTÈME DE CONNEXION TWITCH
    // ==========================================

    function loginWithTwitch() {
        const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;
        window.location.href = authUrl;
    }

    function checkTwitchLogin() {
        const hash = window.location.hash;
        if (hash && hash.includes('access_token')) {
            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            window.history.replaceState({}, document.title, window.location.pathname);
            
            fetch('https://api.twitch.tv/helix/users', { headers: { 'Authorization': `Bearer ${accessToken}`, 'Client-Id': TWITCH_CLIENT_ID } })
            .then(res => res.json())
            .then(data => {
                currentViewerName = data.data[0].display_name; 
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('catalogue-container').style.display = 'flex';
                document.getElementById('titre-joueur').innerText = `Collection de ${currentViewerName.toUpperCase()}`;
                
                // On charge la liste de TOUS LES VIEWERS depuis le Google Sheets !
                fetchViewersList();
                
                // Puis on charge les cartes
                fetchCollection(currentViewerName);
            })
            .catch(err => console.error(err));
        }
    }

    // ==========================================
    // 📇 RÉCUPÉRATION DES PSEUDOS DEPUIS GOOGLE SHEETS
    // ==========================================
    function fetchViewersList() {
        let url = `${API_URL}?action=getViewers&nocache=${new Date().getTime()}`;
        fetch(url)
        .then(res => res.json())
        .then(data => {
            if(Array.isArray(data)) {
                knownViewers = data; // La liste se remplit magiquement !
            }
        })
        .catch(err => console.error("Erreur de chargement des viewers", err));
    }

    // ==========================================
    // 🔎 FONCTION DE RECHERCHE ET AUTOCOMPLÉTION
    // ==========================================

    function showSuggestions(val) {
        const list = document.getElementById('autocomplete-list');
        list.innerHTML = '';
        if (!val) {
            list.style.display = 'none';
            return;
        }
        
        const matches = knownViewers.filter(v => v.toLowerCase().startsWith(val.toLowerCase()));
        
        if (matches.length > 0) {
            list.style.display = 'flex';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = `<strong>${match.substring(0, val.length)}</strong>${match.substring(val.length)}`;
                
                div.onclick = function() {
                    document.getElementById('search-input').value = match;
                    list.style.display = 'none';
                    rechercherViewer(); 
                };
                list.appendChild(div);
            });
        } else {
            list.style.display = 'none';
        }
    }

    document.addEventListener('click', function(e) {
        if (e.target.id !== 'search-input') {
            const list = document.getElementById('autocomplete-list');
            if(list) list.style.display = 'none';
        }
    });
    
    function rechercherViewer() {
        const input = document.getElementById('search-input').value.trim();
        if(input !== "") {
            document.getElementById('autocomplete-list').style.display = 'none'; 
            currentViewerName = input; 
            document.getElementById('catalogue-grid').innerHTML = '';
            document.getElementById('message-box').style.display = "block";
            document.getElementById('message-box').innerText = `Recherche de la collection de ${input}...`;
            document.getElementById('titre-joueur').innerText = `Collection de ${input.toUpperCase()}`;
            fetchCollection(input);
        }
    }

    document.getElementById('search-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { rechercherViewer(); }
    });

    // ==========================================
    // 📊 AFFICHAGE DES CARTES
    // ==========================================

    function fetchCollection(viewer) {
        let url = `${API_URL}?action=get&viewer=${encodeURIComponent(viewer)}&nocache=${new Date().getTime()}`;
        fetch(url).then(r => r.json()).then(cardCounts => {
            document.getElementById('message-box').style.display = "none";
            afficherGrille(cardCounts);
        }).catch(err => {
            document.getElementById('message-box').innerText = "Erreur lors du chargement de la collection.";
        });
    }

    function afficherGrille(cardCounts) {
        const grid = document.getElementById('catalogue-grid');
        grid.innerHTML = '';
        let unlockedTotal = 0;

        allCards.forEach(card => {
            const count = cardCounts[card.id] || 0;
            const isUnlocked = count > 0;
            
            const cardDiv = document.createElement('div');
            cardDiv.className = `mini-card ${card.rarityClass} ${isUnlocked ? '' : 'locked'}`;
            
            if(isUnlocked) {
                unlockedTotal++;
                cardDiv.onclick = () => openModal(card);
            }

            const img = document.createElement('img');
            img.src = card.image || ''; 
            cardDiv.appendChild(img);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'mini-name';
            nameDiv.innerText = card.name;
            cardDiv.appendChild(nameDiv);
            
            const countDiv = document.createElement('div');
            countDiv.className = 'mini-count';
            countDiv.innerText = `x${count}`;
            cardDiv.appendChild(countDiv);
            
            grid.appendChild(cardDiv);
        });
        document.getElementById('cat-count').innerText = unlockedTotal;
    }

    // ==========================================
    // 🔍 SYSTÈME D'AGRANDISSEMENT ET TÉLÉCHARGEMENT HD
    // ==========================================

    function openModal(card) {
        document.getElementById('full-card-render').className = `full-card ${card.rarityClass}`;
        
        const imageUrl = card.image + '?nocache=' + new Date().getTime();
        document.getElementById('modal-img').style.backgroundImage = `url('${imageUrl}')`;
        
        document.getElementById('modal-title').innerText = card.name;
        document.getElementById('modal-role').innerText = card.roleName;
        document.getElementById('modal-rarity-badge').innerText = card.rarityLabel;
        
        document.getElementById('modal-footer-info').innerText = `#${card.id} | Tirée par ${currentViewerName}`;

        document.getElementById('card-modal').style.display = 'flex';
    }

    function closeModal(event) {
        document.getElementById('card-modal').style.display = 'none';
    }

    function downloadCard() {
        const cardName = document.getElementById('modal-title').innerText;
        const btn = document.getElementById('download-btn');
        const captureZone = document.getElementById('capture-zone');
        
        btn.innerText = "📸 Création de la carte...";

        html2canvas(captureZone, {
            useCORS: true,
            backgroundColor: null, 
            scale: 2 
        }).then(canvas => {
            const dataURL = canvas.toDataURL("image/png");
            const a = document.createElement("a");
            a.href = dataURL;
            a.download = `Vibe_Carte_${cardName.replace(/\s+/g, '_')}.png`; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            btn.innerText = "✅ Carte Téléchargée !";
            setTimeout(() => { btn.innerText = "💾 Télécharger la Carte"; }, 2000);
        }).catch(err => {
            alert("Erreur lors de la création de la carte.");
            btn.innerText = "💾 Télécharger la Carte";
        });
    }
    
    checkTwitchLogin();
</script>
