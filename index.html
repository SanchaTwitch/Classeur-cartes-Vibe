    function loginWithTwitch() {
        const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;
        window.location.href = authUrl;
    }

    function checkTwitchLogin() {
        const hash = window.location.hash;
        if (hash && hash.includes('access_token')) {
            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            window.history.replaceState({}, document.title, window.location.pathname);
            
            fetch('https://api.twitch.tv/helix/users', { headers: { 'Authorization': `Bearer ${accessToken}`, 'Client-Id': TWITCH_CLIENT_ID } })
            .then(res => res.json())
            .then(data => {
                currentViewerName = data.data[0].display_name; 
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('catalogue-container').style.display = 'flex';
                fetchViewersList();
                currentSearchedViewer = currentViewerName;
                document.getElementById('titre-joueur').innerText = `Collection de ${currentSearchedViewer.toUpperCase()}`;
                fetchCollection(currentSearchedViewer);
            }).catch(err => console.error(err));
        }
    }

    function fetchViewersList() {
        fetch(`${API_URL}?action=getViewers&nocache=${new Date().getTime()}`).then(r => r.json()).then(d => { if(Array.isArray(d)) knownViewers = d; });
    }

    function showSuggestions(val) {
        const list = document.getElementById('autocomplete-list');
        list.innerHTML = '';
        if (!val) { list.style.display = 'none'; return; }
        const matches = knownViewers.filter(v => v.toLowerCase().startsWith(val.toLowerCase()));
        if (matches.length > 0) {
            list.style.display = 'flex';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = `<strong>${match.substring(0, val.length)}</strong>${match.substring(val.length)}`;
                div.onclick = function() { document.getElementById('search-input').value = match; list.style.display = 'none'; rechercherViewer(); };
                list.appendChild(div);
            });
        } else { list.style.display = 'none'; }
    }

    document.addEventListener('click', e => { if (e.target.id !== 'search-input') { const l = document.getElementById('autocomplete-list'); if(l) l.style.display = 'none'; } });
    
    function rechercherViewer() {
        const input = document.getElementById('search-input').value.trim();
        if(input !== "") {
            document.getElementById('autocomplete-list').style.display = 'none'; 
            currentSearchedViewer = input; 
            document.getElementById('catalogue-grid').innerHTML = '';
            document.getElementById('badges-container').innerHTML = ''; 
            document.getElementById('message-box').style.display = "block";
            document.getElementById('message-box').innerText = `Recherche de la collection de ${input}...`;
            document.getElementById('titre-joueur').innerText = `Collection de ${input.toUpperCase()}`;
            fetchCollection(input);
        }
    }

    document.getElementById('search-input').addEventListener('keypress', e => { if (e.key === 'Enter') rechercherViewer(); });

    function fetchCollection(viewer) {
        document.getElementById('vp-display-container').style.display = 'none';
        fetch(`${API_URL}?action=getProfile&viewer=${encodeURIComponent(viewer)}&nocache=${new Date().getTime()}`)
        .then(r => r.json()).then(data => {
            currentProfileData = data; 
            document.getElementById('message-box').style.display = "none";
            if (currentViewerName.toLowerCase() === viewer.toLowerCase()) {
                document.getElementById('vp-display-container').style.display = 'flex';
                document.getElementById('vp-count').innerText = data.economy.vibePoints;
            }
            afficherGrille(data.inventory, data.boostCard);
            genererBadges(data.inventory);
        }).catch(() => { document.getElementById('message-box').innerText = "Erreur lors du chargement."; });
    }

    function genererBadges(inventory) {
        const container = document.getElementById('badges-container');
        container.innerHTML = ''; 
        const userUniqueCounts = {};
        for(let id in inventory) {
            if(inventory[id] > 0) {
                let cardObj = allCards.find(c => c.id === id);
                if(cardObj) userUniqueCounts[cardObj.rarityClass] = (userUniqueCounts[cardObj.rarityClass] || 0) + 1;
            }
        }
        const icones = { "commune": "🔘", "peu-commun": "❇️", "rare": "🔷", "tres-rare": "🔮", "legendaire": "👑", "mythique": "👹" };
        const noms = { "commune": "Communes", "peu-commun": "Peu Communes", "rare": "Rares", "tres-rare": "Très Rares", "legendaire": "Légendaires", "mythique": "Mythiques" };

        for (let rarity in requiredForBadge) {
            if(userUniqueCounts[rarity] === requiredForBadge[rarity]) {
                const badge = document.createElement('div');
                badge.className = `badge-icon badge-${rarity}`;
                badge.innerHTML = icones[rarity];
                badge.setAttribute("data-tooltip", `Maître des ${noms[rarity]} (100%)`);
                container.appendChild(badge);
            }
        }
    }

    function afficherGrille(inventory, boostCardId) {
        const grid = document.getElementById('catalogue-grid');
        grid.innerHTML = '';
        let unlockedTotal = 0;

        allCards.forEach(card => {
            const count = inventory[card.id] || 0;
            const isUnlocked = count > 0;
            const isBoosted = (card.id === boostCardId);
            
            const cardDiv = document.createElement('div');
            cardDiv.className = `mini-card ${card.rarityClass} ${isUnlocked ? '' : 'locked'} ${isBoosted ? 'daily-boost' : ''}`;
            
            if(isUnlocked) {
                unlockedTotal++;
                cardDiv.onclick = () => openModal(card, count, isBoosted);
            }

            if(isBoosted) {
                const tag = document.createElement('div');
                tag.className = 'boost-tag';
                tag.innerText = "🔥 x2";
                cardDiv.appendChild(tag);
            }

            const imgWrapper = document.createElement('div');
            imgWrapper.className = "card-img-wrapper";
            const img = document.createElement('img');
            img.src = card.image || ''; 
            imgWrapper.appendChild(img);
            cardDiv.appendChild(imgWrapper);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'mini-name';
            nameDiv.innerText = card.name;
            cardDiv.appendChild(nameDiv);
            
            const countDiv = document.createElement('div');
            countDiv.className = 'mini-count';
            countDiv.innerText = `x${count}`;
            cardDiv.appendChild(countDiv);
            
            grid.appendChild(cardDiv);
        });
        document.getElementById('cat-count').innerText = unlockedTotal;
    }

    // ACTUALISATION DU PANNEAU DE RECYCLAGE EN TEMPS RÉEL
    function updateRecycleUI() {
        if (!currentOpenCard) return;
        const slider = document.getElementById('recycle-slider');
        const qtyDisplay = document.getElementById('recycle-qty-display');
        const btn = document.getElementById('recycle-btn');
        
        const qty = parseInt(slider.value, 10);
        qtyDisplay.innerText = qty;
        
        const isBoosted = (currentOpenCard.id === currentProfileData.boostCard);
        let baseReward = VP_RECYCLE_VALUES[currentOpenCard.rarityClass];
        if (isBoosted) baseReward *= 2;
        
        const totalReward = baseReward * qty;
        btn.innerText = `♻️ Recycler ${qty} carte${qty > 1 ? 's' : ''} (+${totalReward} VP)`;
    }

    function openModal(card, count, isBoosted) {
        currentOpenCard = card;
        currentOpenCount = count;
        
        const isOwner = (currentViewerName.toLowerCase() === currentSearchedViewer.toLowerCase());
        const recycleControls = document.getElementById('recycle-controls-wrapper');
        const boostTag = document.getElementById('modal-boost-tag');

        boostTag.style.display = isBoosted ? 'block' : 'none';

        // Affichage des contrôles de recyclage
        if (isOwner && count > 1) {
            recycleControls.style.display = 'flex';
            document.getElementById('recycle-btn').disabled = false;
            
            const slider = document.getElementById('recycle-slider');
            slider.max = count - 1; // Règle d'or : Ne jamais descendre à 0
            slider.value = 1;
            
            updateRecycleUI(); // On calcule l'affichage initial
        } else {
            recycleControls.style.display = 'none';
        }

        let rColor, bgGradient;
        switch(card.rarityClass) {
            case 'commune': rColor = '#555555'; bgGradient = 'linear-gradient(135deg, #2b2b2b 0%, #111 100%)'; break;
            case 'peu-commun': rColor = '#2ecc71'; bgGradient = 'linear-gradient(135deg, #0b2e13 0%, #000 100%)'; break;
            case 'rare': rColor = '#00d2ff'; bgGradient = 'linear-gradient(135deg, #001f3f 0%, #000 100%)'; break;
            case 'tres-rare': rColor = '#9b59b6'; bgGradient = 'linear-gradient(135deg, #2b003b 0%, #000 100%)'; break;
            case 'legendaire': rColor = '#ffd700'; bgGradient = 'linear-gradient(135deg, #4b3621 0%, #000 100%)'; break;
            case 'mythique': rColor = '#ff0055'; bgGradient = 'linear-gradient(135deg, #3b0000 0%, #000 100%)'; break;
        }

        const renderDiv = document.getElementById('full-card-render');
        const titleEl = document.getElementById('modal-title');
        const badgeEl = document.getElementById('modal-rarity-badge');
        
        renderDiv.className = `full-card ${card.rarityClass} ${isBoosted ? 'daily-boost' : ''}`;
        renderDiv.style.borderColor = isBoosted ? '#ff4500' : rColor;
        renderDiv.style.background = bgGradient;
        
        badgeEl.style.backgroundColor = rColor;
        badgeEl.style.color = (card.rarityClass === 'peu-commun' || card.rarityClass === 'legendaire' || card.rarityClass === 'rare') ? 'black' : 'white';
        
        badgeEl.innerText = card.rarityLabel.toUpperCase();
        titleEl.innerText = card.name.toUpperCase();
        document.getElementById('modal-role').innerText = card.roleName.toUpperCase();
        
        if(card.rarityClass === 'mythique') { titleEl.style.color = '#ffb3c6'; titleEl.style.textShadow = '0 0 20px #ff0055'; }
        else if (card.rarityClass === 'legendaire') { titleEl.style.color = '#ffd700'; titleEl.style.textShadow = '0 0 15px #ffd700'; }
        else if (card.rarityClass === 'commune') { titleEl.style.color = '#eee'; titleEl.style.textShadow = 'none'; }
        else { titleEl.style.color = 'white'; titleEl.style.textShadow = `0 0 10px ${rColor}`; }

        document.getElementById('modal-img').src = card.image + '?nocache=' + new Date().getTime();
        
        const holoEl = document.getElementById('modal-holo');
        holoEl.className = `holographic-glare holo-${card.rarityClass}`;
        
        let safeViewerName = currentSearchedViewer || "Inconnu";
        document.getElementById('modal-footer-info').innerText = `#${card.id} | Tirée par ${safeViewerName}`;
        
        document.getElementById('card-modal').style.display = 'flex';
    }

    function closeModal(event) { document.getElementById('card-modal').style.display = 'none'; }

    // FONCTION DE RECYCLAGE MULTIPLE
    function recyclerCarte() {
        if (!currentOpenCard) return;
        
        const btn = document.getElementById('recycle-btn');
        const slider = document.getElementById('recycle-slider');
        const qtyToRecycle = parseInt(slider.value, 10);
        
        btn.disabled = true;
        btn.innerText = "⏳ Recyclage en cours...";

        const isBoosted = (currentOpenCard.id === currentProfileData.boostCard);
        let baseReward = VP_RECYCLE_VALUES[currentOpenCard.rarityClass];
        if (isBoosted) baseReward *= 2;
        
        const totalReward = baseReward * qtyToRecycle;

        let url = `${API_URL}?action=recycle&viewer=${encodeURIComponent(currentViewerName)}&cardId=${currentOpenCard.id}&vpReward=${totalReward}&amount=${qtyToRecycle}&nocache=${new Date().getTime()}`;

        fetch(url).then(r => r.json()).then(res => {
            if(res.success) {
                alert(`♻️ Succès ! Vous avez recyclé ${qtyToRecycle} carte(s) pour ${totalReward} Vibe Points.`);
                closeModal();
                fetchCollection(currentViewerName);
            } else {
                alert("Erreur: " + res.message);
                btn.disabled = false;
                updateRecycleUI(); // Remet le texte du bouton à la normale
            }
        }).catch(err => {
            alert("Erreur réseau.");
            btn.disabled = false;
            updateRecycleUI();
        });
    }

    function downloadCard() {
        if (!currentOpenCard) return;
        const btn = document.getElementById('download-btn');
        const captureZone = document.getElementById('capture-zone');
        const holoEl = document.getElementById('modal-holo');
        
        btn.innerText = "📸 Création...";
        const hasHolo = holoEl && !holoEl.className.includes('commune') && !holoEl.className.includes('peu-commun');
        if(hasHolo) holoEl.style.display = 'none';

        const rarityStr = currentOpenCard.rarityLabel.replace(/\s+/g, '_').toUpperCase();
        const fileName = `${rarityStr}_${currentOpenCard.id}_${currentOpenCard.name.replace(/\s+/g, '_')}.png`;

        setTimeout(() => {
            htmlToImage.toPng(captureZone, { pixelRatio: 2, backgroundColor: 'rgba(0,0,0,0)' })
            .then(function (dataURL) {
                if(hasHolo) holoEl.style.display = 'block';
                const a = document.createElement("a");
                a.href = dataURL; a.download = fileName; 
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                btn.innerText = "✅ Téléchargée !";
                setTimeout(() => { btn.innerText = "💾 Télécharger la carte"; }, 2000);
            }).catch(function (error) {
                if(hasHolo) holoEl.style.display = 'block';
                btn.innerText = "💾 Télécharger la carte";
            });
        }, 150); 
    }
    
    checkTwitchLogin();
</script>
