        <button id="download-btn" onclick="downloadCard()">💾 Télécharger la Carte</button>

</div>

    document.getElementById('cat-total').innerText = allCards.length;

    // ==========================================
    // 🔐 SYSTÈME DE CONNEXION TWITCH
    // ==========================================

    function loginWithTwitch() {
        const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;
        window.location.href = authUrl;
    }

    function checkTwitchLogin() {
        const hash = window.location.hash;
        
        if (hash && hash.includes('access_token')) {
            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            
            window.history.replaceState({}, document.title, window.location.pathname);
            
            fetch('https://api.twitch.tv/helix/users', {
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Client-Id': TWITCH_CLIENT_ID }
            })
            .then(res => res.json())
            .then(data => {
                const viewerName = data.data[0].display_name;
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('catalogue-container').style.display = 'flex';
                document.getElementById('titre-joueur').innerText = `Collection de ${viewerName.toUpperCase()}`;
                fetchCollection(viewerName);
            })
            .catch(err => {
                alert("Erreur de connexion avec Twitch.");
                console.error(err);
            });
        }
    }

    // ==========================================
    // 🔎 FONCTION DE RECHERCHE
    // ==========================================
    
    function rechercherViewer() {
        const input = document.getElementById('search-input').value.trim();
        if(input !== "") {
            document.getElementById('catalogue-grid').innerHTML = '';
            document.getElementById('message-box').style.display = "block";
            document.getElementById('message-box').innerText = `Recherche de la collection de ${input}...`;
            document.getElementById('titre-joueur').innerText = `Collection de ${input.toUpperCase()}`;
            fetchCollection(input);
        }
    }

    document.getElementById('search-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { rechercherViewer(); }
    });

    // ==========================================
    // 📊 AFFICHAGE DES CARTES
    // ==========================================

    function fetchCollection(viewer) {
        let url = `${API_URL}?action=get&viewer=${encodeURIComponent(viewer)}&nocache=${new Date().getTime()}`;

        fetch(url)
            .then(response => response.json())
            .then(cardCounts => {
                document.getElementById('message-box').style.display = "none";
                afficherGrille(cardCounts);
            })
            .catch(error => {
                document.getElementById('message-box').innerText = "Erreur lors du chargement de la collection.";
            });
    }

    function afficherGrille(cardCounts) {
        const grid = document.getElementById('catalogue-grid');
        grid.innerHTML = '';
        let unlockedTotal = 0;

        allCards.forEach(card => {
            const count = cardCounts[card.id] || 0;
            const isUnlocked = count > 0;
            
            const cardDiv = document.createElement('div');
            cardDiv.className = `mini-card ${card.rarityClass} ${isUnlocked ? '' : 'locked'}`;
            
            if(isUnlocked) {
                unlockedTotal++;
                // On envoie toutes les infos de la carte à la fenêtre d'agrandissement !
                cardDiv.onclick = () => openModal(card);
            }

            const img = document.createElement('img');
            img.src = card.image || ''; 
            cardDiv.appendChild(img);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'mini-name';
            nameDiv.innerText = card.name;
            cardDiv.appendChild(nameDiv);
            
            const countDiv = document.createElement('div');
            countDiv.className = 'mini-count';
            countDiv.innerText = `x${count}`;
            cardDiv.appendChild(countDiv);
            
            grid.appendChild(cardDiv);
        });

        document.getElementById('cat-count').innerText = unlockedTotal;
    }

    // ==========================================
    // 🔍 SYSTÈME D'AGRANDISSEMENT ET TÉLÉCHARGEMENT HD
    // ==========================================

    function getRarityColor(cls) {
        switch(cls) {
            case 'commune': return '#ccc';
            case 'peu-commun': return '#2ecc71';
            case 'rare': return '#00d2ff';
            case 'tres-rare': return '#9b59b6';
            case 'legendaire': return '#ffd700';
            case 'mythique': return '#ff0055';
            default: return 'white';
        }
    }

    function openModal(card) {
        // On modifie l'HTML de la fenêtre pour qu'il prenne le design de la carte !
        document.getElementById('full-card-render').className = `full-card ${card.rarityClass}`;
        
        // Ajout d'un petit timestamp pour éviter les bugs de cache lors du téléchargement
        document.getElementById('modal-img').src = card.image + '?nocache=' + new Date().getTime(); 
        
        document.getElementById('modal-title').innerText = card.name;
        
        document.getElementById('modal-role').innerText = card.roleName;
        document.getElementById('modal-role').style.color = card.roleColor || 'white';
        
        document.getElementById('modal-rarity').innerText = card.rarityLabel;
        document.getElementById('modal-rarity').style.color = getRarityColor(card.rarityClass);

        document.getElementById('card-modal').style.display = 'flex';
    }

    function closeModal(event) {
        document.getElementById('card-modal').style.display = 'none';
    }

    function downloadCard() {
        const cardName = document.getElementById('modal-title').innerText;
        const btn = document.getElementById('download-btn');
        const captureZone = document.getElementById('capture-zone');
        
        btn.innerText = "📸 Création de la carte...";

        // L'outil magique prend une "capture d'écran" du bloc HTML !
        html2canvas(captureZone, {
            useCORS: true,           // Autorise la lecture de l'image externe
            backgroundColor: null,   // Garde la transparence autour de la carte
            scale: 2                 // Augmente la qualité (Haute Définition)
        }).then(canvas => {
            const dataURL = canvas.toDataURL("image/png");

            const a = document.createElement("a");
            a.href = dataURL;
            a.download = `Vibe_Carte_${cardName.replace(/\s+/g, '_')}.png`; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            btn.innerText = "✅ Carte Téléchargée !";
            setTimeout(() => { btn.innerText = "💾 Télécharger la Carte"; }, 2000);
        }).catch(err => {
            alert("Erreur lors de la création de la carte.");
            console.error(err);
            btn.innerText = "💾 Télécharger la Carte";
        });
    }
    
    checkTwitchLogin();
</script>
